<div id="vault">
    <h2>🔓 Bóveda Privada</h2>
    <p>Solo tú puedes ver esto.</p>
    
    <input type="file" id="imageInput" accept="image/*" style="color:white; margin-bottom:20px;">
    
    <div class="secret-content">
        <div id="gallery">
            <p>No hay archivos guardados.</p>
        </div>
    </div>
    <br>
    <button onclick="lockVault()" style="background:#e74c3c; color:white;">Cerrar y Bloquear</button>
</div>

<script>
    // Lógica para mostrar la imagen seleccionada
    const imageInput = document.getElementById('imageInput');
    const gallery = document.getElementById('gallery');

    imageInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                gallery.innerHTML = `<img src="${e.target.result}" style="width:100%; border-radius:5px;">`;
                // Aquí podrías usar localStorage.setItem para guardarla permanentemente
            }
            reader.readAsDataURL(file);
        }
    });

    // ... (Mantén el resto de la lógica de la calculadora que te pasé antes)
</script>
